---
# Debian 12 nao possui o plugin "docker compose" v2 nos repositorios padrao;
# usa-se o repositorio oficial do Docker.
- name: Criar diretorio de chaves APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar chave do repositorio Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Configurar repositorio Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true

- name: Instalar Docker Engine e Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Configurar rotacao de logs do Docker
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    mode: "0644"
  notify: Reiniciar Docker

- name: Garantir Docker iniciado
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Aplicar configuracao do Docker agora
  ansible.builtin.meta: flush_handlers
