---
- name: Atualizar cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar Docker
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-plugin
    state: present

- name: Garantir Docker iniciado
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started