---
- name: Criar diretório temporário
  ansible.builtin.file:
    path: /tmp/mongo-backup
    state: directory
    mode: "0755"

- name: Gerar nome do backup
  ansible.builtin.set_fact:
    backup_file: "/tmp/mongo-backup/mongodb-{{ ansible_date_time.epoch }}.archive.gz"

- name: Executar mongodump
  ansible.builtin.command:
    cmd: >
      docker exec {{ mongo_container_name }}
      mongodump
      --username={{ mongo_root_username }}
      --password={{ mongo_root_password }}
      --authenticationDatabase=admin
      --gzip
      --archive=/tmp/backup.archive.gz
  no_log: true

- name: Copiar backup para o host
  ansible.builtin.command:
    cmd: >
      docker cp
      {{ mongo_container_name }}:/tmp/backup.archive.gz
      {{ backup_file }}

- name: Enviar backup para o bucket
  ansible.builtin.command:
    cmd: >
      gsutil cp
      {{ backup_file }}
      gs://{{ backup_bucket }}/{{ kubeshop_environment }}/
- name: Remover arquivo temporário do container
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ mongo_container_name }}"
      - rm
      - -f
      - /tmp/backup.archive.gz
  changed_when: false

- name: Remover arquivo temporário do host
  ansible.builtin.file:
    path: "{{ backup_file }}"
    state: absent
