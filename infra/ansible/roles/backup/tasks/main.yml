---
- name: Verificar o Google Cloud CLI
  ansible.builtin.command: which gcloud
  register: backup_gcloud
  changed_when: false
  failed_when: false

- name: Instalar o Google Cloud CLI quando ausente
  when: backup_gcloud.rc != 0
  block:
    - name: Baixar chave do repositorio Google Cloud
      ansible.builtin.get_url:
        url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
        dest: /usr/share/keyrings/cloud.google.asc
        mode: "0644"

    - name: Configurar repositorio Google Cloud
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/cloud.google.asc] https://packages.cloud.google.com/apt cloud-sdk main"
        filename: google-cloud-sdk
        state: present
        update_cache: true

    - name: Instalar google-cloud-cli
      ansible.builtin.apt:
        name: google-cloud-cli
        state: present

- name: Instalar o script de backup
  ansible.builtin.template:
    src: kubeshop-backup.sh.j2
    dest: /usr/local/sbin/kubeshop-backup.sh
    mode: "0750"

- name: Instalar o servico de backup
  ansible.builtin.template:
    src: kubeshop-backup.service.j2
    dest: /etc/systemd/system/kubeshop-backup.service
    mode: "0644"
  notify: Recarregar systemd

- name: Instalar o timer de backup diario
  ansible.builtin.template:
    src: kubeshop-backup.timer.j2
    dest: /etc/systemd/system/kubeshop-backup.timer
    mode: "0644"
  notify: Recarregar systemd

- name: Aplicar unidades systemd agora
  ansible.builtin.meta: flush_handlers

- name: Habilitar e iniciar o timer de backup
  ansible.builtin.systemd_service:
    name: kubeshop-backup.timer
    enabled: true
    state: started
