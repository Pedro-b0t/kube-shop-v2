---
- name: Verificar se o disco de dados esta anexado
  ansible.builtin.stat:
    path: /dev/disk/by-id/google-mongo-data
  register: mongodb_disk

# Sem o disco dedicado os dados ficariam no disco de boot e se perderiam ao recriar a VM (REQ-05).
- name: Exigir o disco de dados dedicado
  ansible.builtin.assert:
    that: mongodb_disk.stat.exists
    fail_msg: Disco /dev/disk/by-id/google-mongo-data nao encontrado na VM do banco.

- name: Criar diretorio de dados do MongoDB
  ansible.builtin.file:
    path: /var/lib/mongo
    state: directory
    mode: "0755"

- name: Formatar disco de dados (somente se ainda nao tiver sistema de arquivos)
  community.general.filesystem:
    dev: /dev/disk/by-id/google-mongo-data
    fstype: ext4

- name: Montar disco de dados
  ansible.posix.mount:
    path: /var/lib/mongo
    src: /dev/disk/by-id/google-mongo-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted

# Diretorio restrito ao root; os arquivos de segredo precisam ser legiveis
# pelos usuarios nao-root dentro dos containers (mesmo modelo do setup local).
- name: Criar diretorio da aplicacao
  ansible.builtin.file:
    path: /opt/kubeshop
    state: directory
    mode: "0700"

- name: Criar segredo root do MongoDB
  ansible.builtin.copy:
    content: "{{ mongo_root_password }}"
    dest: /opt/kubeshop/mongo-root-password
    mode: "0444"
  no_log: true

- name: Criar segredo da aplicacao
  ansible.builtin.copy:
    content: "{{ mongo_app_password }}"
    dest: /opt/kubeshop/mongo-app-password
    mode: "0444"
  no_log: true

- name: Copiar scripts de inicializacao e healthcheck do MongoDB
  ansible.builtin.copy:
    src: "{{ repo_root }}/docker/mongodb/{{ item.src }}"
    dest: "/opt/kubeshop/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: init.js, dest: init.js }
    - { src: healthcheck.js, dest: healthcheck.js }

- name: Gerar compose do MongoDB
  ansible.builtin.template:
    src: compose.db.yaml.j2
    dest: /opt/kubeshop/compose.db.yaml
    mode: "0644"

- name: Subir MongoDB
  community.docker.docker_compose_v2:
    project_src: /opt/kubeshop
    files:
      - compose.db.yaml
    state: present
    pull: "{{ 'always' if force_pull_images | bool else 'missing' }}"
    wait: true
    wait_timeout: 240
