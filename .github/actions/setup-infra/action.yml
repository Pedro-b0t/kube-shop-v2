name: Preparar GCP e ferramentas
description: Autentica no GCP por Workload Identity Federation (sem chave JSON) e instala Terraform e, opcionalmente, Ansible.

inputs:
  workload_identity_provider:
    description: Recurso do provedor WIF (projects/NUM/locations/global/workloadIdentityPools/POOL/providers/PROVEDOR)
    required: true
  service_account:
    description: Service Account impersonada pelo pipeline
    required: true
  terraform:
    description: Instalar Terraform
    default: "true"
  ansible:
    description: Instalar Ansible e as colecoes necessarias
    default: "false"

runs:
  using: composite
  steps:
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - uses: google-github-actions/setup-gcloud@v2

    - if: inputs.terraform == 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "^1.9.0"
        terraform_wrapper: false

    - if: inputs.ansible == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - if: inputs.ansible == 'true'
      shell: bash
      run: |
        python -m pip install --quiet "ansible-core>=2.17,<2.20" ansible-lint
        ansible-galaxy collection install -r infra/ansible/requirements.yml
